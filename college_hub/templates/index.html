<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notes & Question Paper Hub</title>
    <!-- Sundar design ke liye Bootstrap CDN -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 class="text-center text-primary mb-4">📚 Automated College Notes & Paper Hub</h2>

    <!-- 1. UPLOAD SECTION -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Upload New Notes / Question Paper</h5>
        </div>
        <div class="card-body">
            <form action="/upload" method="POST" enctype="multipart/form-data" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Title (e.g., Unit 1 Notes / 2024 Paper)</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Subject Name</label>
                    <input type="text" name="subject" class="form-control" placeholder="e.g., Operating System" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Semester</label>
                    <select name="semester" class="form-select" required>
                        <option value="1st Sem">1st Sem</option>
                        <option value="2nd Sem">2nd Sem</option>
                        <option value="3rd Sem">3rd Sem</option>
                        <option value="4th Sem">4th Sem</option>
                        <option value="5th Sem" selected>5th Sem</option>
                        <option value="6th Sem">6th Sem</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Document Type</label>
                    <select name="doc_type" class="form-select" required>
                        <option value="Notes">Lecture Notes</option>
                        <option value="Question Paper">Question Paper</option>
                        <option value="Lab Manual">Lab Manual</option>
                    </select>
                </div>
                <div class="col-md-9">
                    <label class="form-label">Select File (PDF, DOCX, PPT)</label>
                    <input type="file" name="file" class="form-control" required>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Upload Material</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. SEARCH & FILTER SECTION -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="GET" action="/" class="row g-2">
                <div class="col-md-6">
                    <input type="text" name="search" class="form-control" placeholder="Search by subject or title..." value="{{ search_query }}">
                </div>
                <div class="col-md-4">
                    <select name="semester" class="form-select">
                        <option value="">All Semesters</option>
                        <option value="1st Sem" {% if sem_filter == '1st Sem' %}selected{% endif %}>1st Sem</option>
                        <option value="2nd Sem" {% if sem_filter == '2nd Sem' %}selected{% endif %}>2nd Sem</option>
                        <option value="3rd Sem" {% if sem_filter == '3rd Sem' %}selected{% endif %}>3rd Sem</option>
                        <option value="4th Sem" {% if sem_filter == '4th Sem' %}selected{% endif %}>4th Sem</option>
                        <option value="5th Sem" {% if sem_filter == '5th Sem' %}selected{% endif %}>5th Sem</option>
                        <option value="6th Sem" {% if sem_filter == '6th Sem' %}selected{% endif %}>6th Sem</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Search</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. MATERIALS LIST TABLE -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Available Study Materials</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-secondary">
                    <tr>
                        <th>Title</th>
                        <th>Subject</th>
                        <th>Semester</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in materials %}
                    <tr>
                        <td>{{ item[1] }}</td>
                        <td>{{ item[2] }}</td>
                        <td><span class="badge bg-info text-dark">{{ item[3] }}</span></td>
                        <td><span class="badge bg-warning text-dark">{{ item[4] }}</span></td>
                        <td>
                            <a href="/download/{{ item[5] }}" class="btn btn-sm btn-outline-primary">Download</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="text-center py-3 text-muted">No study materials found. Upload one above!</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
